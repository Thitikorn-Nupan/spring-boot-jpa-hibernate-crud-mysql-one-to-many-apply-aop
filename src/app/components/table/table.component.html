<div class="relative overflow-x-auto mt-4">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">

    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <ng-container *ngFor="let headerColumn of headerColumns;  let i = index;">
        <th scope="col" [class]="getColumnWidth(i)">
          {{ headerColumn }}
        </th>
      </ng-container>
    </thead>

    <tbody>
      <ng-container *ngFor="let author of data;  let i = index;" >
        <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
          <td class="w-4 p-4">
            <div class="flex items-center">
              {{ i + 1 }}
            </div>
          </td>
          <th scope="row" class="flex items-center px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white">
            <img class="w-10 h-10 rounded-full" [src]="author.image" alt="Jese image">
            <div class="ps-3">
              <div class="text-base font-semibold">{{ author.fullname }}</div>
              <div class="font-normal text-gray-500">{{ author.age }} Year</div>
            </div>
          </th>
          <td class="px-6 py-4">
            {{ author.editHistories.length }}
          </td>
          <td class="px-6 py-4">
            <div class="flex items-center">
              <div>
                <div [class]="getColorStatus(author.alive)"></div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4  text-center">
            <!--(click)="enableCard(author)"-->
            <button (click)="onReadClick(author)" class="font-medium text-blue-600 dark:text-blue-500 hover:text-xs p-3">
              Read
            </button>
            <!--(click)="enableForm(author)"-->
            <button (click)="onUpdateClick(author)" class="font-medium text-blue-600 dark:text-blue-500 hover:text-xs p-3">
              Edit
            </button>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
