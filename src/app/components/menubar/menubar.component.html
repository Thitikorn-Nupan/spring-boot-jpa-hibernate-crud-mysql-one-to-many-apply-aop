<ng-container>
  <nav class="border-gray-200 bg-gray-50 dark:bg-gray-800 dark:border-gray-700">
    <div class="flex flex-wrap items-center justify-between  mx-auto pt-5 pb-5">
      <div class="flex items-center space-x-3 rtl:space-x-reverse ml-10">
        <img src="https://www.svgrepo.com/show/406080/letter-t.svg" class="h-8" alt="Flowbite Logo" />
        <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">Angular + Spring Boot</span>
      </div>
      <ng-container>
        <button
          (click)="enableDropdown()"
          data-collapse-toggle="navbar-hamburger"
          type="button"
          class="inline-flex items-center justify-center p-2 w-10 h-10 text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600 mr-10"
          aria-controls="navbar-hamburger"
          aria-expanded="false">
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
          </svg>
        </button>
      </ng-container>
      <ng-container  *ngIf="dropdown">
        <div class="absolute w-full" id="navbar-hamburger" style="z-index: 1; margin-top: 120px; max-width: 700px">
          <ul  class="flex flex-col font-medium mt-4 rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700 text-center">
            <li>
              <!--(click)="dropdown = false" [routerLink]="routers[0]" -->
              <a  class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">Go to table</a>
            </li>
            <li>
              <a (click)="dropdown = false" [routerLink]="routers[1]" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 dark:text-gray-400 md:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white">Go to table (Concept Dynamic)</a>
            </li>
          </ul>
        </div>
      </ng-container>
    </div>
  </nav>
</ng-container>
